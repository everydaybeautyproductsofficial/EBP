<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You're Offline — EverydayBeautyProducts</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#E91E63">
<link rel="icon" type="image/png" href="/favicon.png">
<!--
  IMPORTANT: this page is served by the service worker when there is NO
  network connection at all, so it must NOT depend on any external
  request — no Google Fonts, no Font Awesome CDN, no external CSS/JS.
  Everything below is self-contained (inline styles, system fonts, and
  the logo image, which is precached by service-worker.js).
-->
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    background: linear-gradient(160deg, #FCE4EC 0%, #FFF8FA 60%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    color: #1A1A2E;
  }
  .offline-card {
    background: #ffffff;
    border-radius: 24px;
    max-width: 440px;
    width: 100%;
    padding: 44px 36px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(233, 30, 99, 0.12);
  }
  .offline-logo {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    margin-bottom: 20px;
  }
  .offline-icon {
    font-size: 40px;
    margin-bottom: 16px;
  }
  h1 {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 10px;
    color: #1A1A2E;
  }
  p {
    font-size: 14.5px;
    line-height: 1.6;
    color: #6B6B8A;
    margin-bottom: 28px;
  }
  .btn-retry {
    display: inline-block;
    padding: 13px 32px;
    background: linear-gradient(135deg, #E91E63, #FF4081);
    color: #ffffff;
    text-decoration: none;
    border: none;
    border-radius: 50px;
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-home {
    display: block;
    margin-top: 16px;
    font-size: 13.5px;
    color: #E91E63;
    text-decoration: none;
    font-weight: 600;
  }
</style>
</head>
<body>

  <div class="offline-card">
    <picture>
      <source srcset="/assets/webp/logo.webp" type="image/webp">
      <img src="/assets/images/logo.png" alt="EverydayBeautyProducts" class="offline-logo">
    </picture>
    <div class="offline-icon">📡</div>
    <h1>You're Offline</h1>
    <p>
      Looks like there's no internet connection right now. Pages you've
      already visited may still be available — otherwise, please reconnect
      and try again.
    </p>
    <button class="btn-retry" onclick="window.location.reload()">Try Again</button>
    <a href="/index.html" class="btn-home">← Back to Homepage</a>
  </div>

</body>
</html>
